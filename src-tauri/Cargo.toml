[package]
name = "ezaddon"
version = "0.1.0"
description = "Lightweight CurseForge addon manager for WoW Forever"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ezaddon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "stream", "gzip", "system-proxy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Same versions Tauri's webview layer uses, for the WebView2 memory API.
webview2-com = "0.39"
windows-core = "0.62"
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
